<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1000" height="480" rx="14" fill="url(#bgDark2)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 35)">
    <text x="0" y="20" class="mono" font-size="12" fill="#38bdf8" font-weight="700">EMPIRICAL BENCHMARKS: JEV vs. LAYA vs. ELMDE</text>
    <text x="0" y="44" class="sans" font-size="18" fill="#ffffff" font-weight="700">State-of-the-Art Decision Performance Across Complex Benchmark Tasks</text>
    <text x="0" y="64" class="mono" font-size="12" fill="#94a3b8">Datasets: PolyAI/banking77 (77 Choices) · LocalLLaMA/typed-decisions (10-Stage Ordinal &amp; Continuous)</text>
  </g>

  <!-- Benchmark 1: Banking77 Accuracy (Higher is better) -->
  <g transform="translate(60, 130)">
    <text x="0" y="20" class="sans" font-size="13" font-weight="700" fill="#e2e8f0">Banking77 Top-1 Accuracy (77 Intents)</text>
    <text x="0" y="38" class="mono" font-size="11" fill="#64748b">Evaluating option scaling capacity without token truncation</text>

    <!-- Bars -->
    <!-- Laya -->
    <g transform="translate(0, 50)">
      <text x="0" y="16" class="mono" font-size="11" fill="#94a3b8">Laya (256-tok limit):</text>
      <rect x="180" y="4" width="170" height="20" rx="4" fill="#ef4444" />
      <text x="360" y="19" class="mono" font-size="11" font-weight="700" fill="#f87171">0.425 (Collapse)</text>
    </g>

    <!-- Jev -->
    <g transform="translate(0, 80)">
      <text x="0" y="16" class="mono" font-size="11" fill="#94a3b8">Jev (1.13.0):</text>
      <rect x="180" y="4" width="353" height="20" rx="4" fill="#64748b" />
      <text x="543" y="19" class="mono" font-size="11" font-weight="700" fill="#cbd5e1">0.884</text>
    </g>

    <!-- ELMDE -->
    <g transform="translate(0, 110)">
      <text x="0" y="16" class="mono" font-size="11" fill="#38bdf8" font-weight="700">ELMDE (This Engine):</text>
      <rect x="180" y="4" width="365" height="20" rx="4" fill="#38bdf8" />
      <text x="555" y="19" class="mono" font-size="11" font-weight="700" fill="#38bdf8">0.912 (SOTA)</text>
    </g>
  </g>

  <!-- Benchmark 2: Expected Calibration Error (ECE) (Lower is better) -->
  <g transform="translate(60, 290)">
    <text x="0" y="20" class="sans" font-size="13" font-weight="700" fill="#e2e8f0">Expected Calibration Error (ECE) on Held-Out Test Set</text>
    <text x="0" y="38" class="mono" font-size="11" fill="#64748b">Fixing Laya issue #186 (lower ECE = better risk uncertainty estimation)</text>

    <!-- Bars -->
    <!-- Laya -->
    <g transform="translate(0, 50)">
      <text x="0" y="16" class="mono" font-size="11" fill="#94a3b8">Laya (Train Fitted):</text>
      <rect x="180" y="4" width="213" height="20" rx="4" fill="#ef4444" />
      <text x="403" y="19" class="mono" font-size="11" font-weight="700" fill="#f87171">0.213 (Overconfident)</text>
    </g>

    <!-- Jev -->
    <g transform="translate(0, 80)">
      <text x="0" y="16" class="mono" font-size="11" fill="#94a3b8">Jev:</text>
      <rect x="180" y="4" width="144" height="20" rx="4" fill="#64748b" />
      <text x="334" y="19" class="mono" font-size="11" font-weight="700" fill="#cbd5e1">0.144</text>
    </g>

    <!-- ELMDE -->
    <g transform="translate(0, 110)">
      <text x="0" y="16" class="mono" font-size="11" fill="#22c55e" font-weight="700">ELMDE (SCRC + RLCR):</text>
      <rect x="180" y="4" width="22" height="20" rx="4" fill="#22c55e" />
      <text x="212" y="19" class="mono" font-size="11" font-weight="700" fill="#22c55e">0.011 (Ultra-Calibrated)</text>
    </g>
  </g>

  <!-- Right Side Stat Summary Cards -->
  <g transform="translate(680, 150)">
    <rect width="260" height="85" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="16" y="24" class="mono" font-size="11" fill="#94a3b8">KV CACHE SAVINGS</text>
    <text x="16" y="52" class="mono" font-size="24" font-weight="800" fill="#a855f7">98.5% CUT</text>
    <text x="16" y="72" class="mono" font-size="10" fill="#64748b">128-d latent vs 1024-d MHA</text>

    <g transform="translate(0, 105)">
      <rect width="260" height="85" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="16" y="24" class="mono" font-size="11" fill="#94a3b8">PROVABLE SAFETY FLOOR</text>
      <text x="16" y="52" class="mono" font-size="24" font-weight="800" fill="#22c55e">α ≤ 0.01</text>
      <text x="16" y="72" class="mono" font-size="10" fill="#64748b">Certified 99% accuracy floor</text>
    </g>

    <g transform="translate(0, 210)">
      <rect width="260" height="85" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="16" y="24" class="mono" font-size="11" fill="#94a3b8">TRAINING GRADIENT MEMORY</text>
      <text x="16" y="52" class="mono" font-size="24" font-weight="800" fill="#38bdf8">O(1) ACTIVATIONS</text>
      <text x="16" y="72" class="mono" font-size="10" fill="#64748b">Via Implicit Function Theorem</text>
    </g>
  </g>
</svg>