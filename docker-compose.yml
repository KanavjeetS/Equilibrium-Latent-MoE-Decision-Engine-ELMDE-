services:
  elmde-decision-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: elmde:latest
    container_name: elmde_serving_engine
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - PORT=8008
      - LOG_LEVEL=info
      - OMP_NUM_THREADS=4
    volumes:
      - ./checkpoints:/app/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
