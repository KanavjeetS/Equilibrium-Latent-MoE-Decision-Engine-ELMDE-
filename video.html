<script>
// ============================================================================
// GLOBAL ERROR CAPTURE & SAFE UTILITIES
// ============================================================================
const errLog = document.getElementById('errLog');
function reportError(msg, err) {
  console.error(msg, err);
  errLog.style.display = 'block';
  errLog.innerHTML += `[ERROR] ${msg}: ${err ? err.stack || err.message || err : ''}\n`;
}

// Fallback RoundRect for older/restricted rendering engines (prevents script crash)
function drawSafeRoundRect(ctx, x, y, w, h, r, fill, stroke, lineW = 2) {
  try {
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') {
      ctx.roundRect(x, y, w, h, r);
    } else {
      // Manual Path Polyfill
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineW; ctx.stroke(); }
  } catch (e) {
    reportError('drawSafeRoundRect failed', e);
  }
}

// ============================================================================
// CINEMA STAGE & RENDER ENGINE
// ============================================================================
let canvas, ctx, playBtn, recordBtn, statusText;
try {
  canvas = document.getElementById('stage');
  ctx = canvas.getContext('2d');
  playBtn = document.getElementById('playBtn');
  recordBtn = document.getElementById('recordBtn');
  statusText = document.getElementById('statusText');
} catch (e) {
  reportError('Initialization of canvas elements failed', e);
}

const DURATION = 30.0;
let startTime = null;
let isPlaying = false;
let animFrame = null;
let audioCtx = null;
const triggeredCues = new Set();

// Fallback interactive star/cyber particles
const particles = [];
for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * 1280,
    y: Math.random() * 720,
    vx: (Math.random() - 0.5) * 0.7,
    vy: (Math.random() - 0.5) * 0.5,
    r: Math.random() * 2 + 1
  });
}

// ============================================================================
// SOUND SYNTHESIS engine (Zero dependencies, pure WebAudio)
// ============================================================================
function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {
    reportError('Audio initialization failed. Using silent mode.', e);
  }
}

function playSubDrop(freqStart = 110, duration = 1.2) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freqStart, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + duration);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch (e) { console.warn('SubDrop synth error', e); }
}

function playDataPulse(freq = 520, duration = 0.08) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.3, now + duration);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch (e) { }
}

function playChordChime() {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const freqs = [523.25, 659.25, 783.99, 1046.5];
    freqs.forEach((f, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + idx * 0.04);
      gain.gain.setValueAtTime(0.08, now + idx * 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 1.2);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + idx * 0.04);
      osc.stop(now + idx * 0.04 + 1.4);
    });
  } catch (e) { }
}

function triggerOnce(key, fn) {
  if (!triggeredCues.has(key)) {
    triggeredCues.add(key);
    try { fn(); } catch (e) { reportError(`Trigger error on ${key}`, e); }
  }
}

// ============================================================================
// DRAWING SCENES
// ============================================================================
function drawBackground(t) {
  try {
    const grad = ctx.createRadialGradient(640, 360, 50, 640, 360, 750);
    grad.addColorStop(0, '#0a0d1a');
    grad.addColorStop(1, '#020307');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1280, 720);

    // Subtle Grid
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
    ctx.lineWidth = 1;
    const offset = (t * 20) % 50;
    for (let x = 0; x < 1280; x += 50) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 720); ctx.stroke();
    }
    for (let y = offset; y < 720; y += 50) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke();
    }

    // Space Particles
    ctx.fillStyle = 'rgba(0, 242, 254, 0.3)';
    particles.forEach(p => {
      const px = (p.x + p.vx * t * 40 + 1280) % 1280;
      const py = (p.y + p.vy * t * 40 + 720) % 720;
      ctx.beginPath();
      ctx.arc(px, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
  } catch (e) { reportError('Error drawing bg', e); }
}

function drawBadge(text, x, y, color = '#00f2fe') {
  ctx.font = 'bold 12px sans-serif';
  const w = ctx.measureText(text).width + 24;
  drawSafeRoundRect(ctx, x - w / 2, y - 16, w, 32, 16, 'rgba(11, 15, 27, 0.9)', color, 1);
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y + 4);
}

// S3: Looped Latent-MoE
function renderScene3(t) {
  const localT = t - 13.0;
  triggerOnce('s3_drop', () => playSubDrop(95, 1.0));

  drawBadge('SCENE 03 • SYSTEM 1.5: CONTRACTIVE LOOPED LATENT-MoE & TRI-MODAL HEADS', 640, 56, '#a855f7');
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Iterative Latent Equilibrium z* + Zero-Distortion Manifold Heads', 640, 120);

  // MOE Loop circle
  const cx = 320, cy = 390, radius = 130;
  ctx.strokeStyle = 'rgba(168, 85, 247, 0.3)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.stroke();

  const tick = Math.min(4, Math.floor(localT * 1.15) + 1);
  triggerOnce('moe_tick_' + tick, () => playDataPulse(360 + tick * 80, 0.1));

  for (let e = 0; e < 8; e++) {
    const ang = (e / 8) * Math.PI * 2 + localT * 1.0;
    const isActive = (e % 2 === tick % 2);
    ctx.fillStyle = isActive ? '#00f2fe' : '#334155';
    ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * radius, cy + Math.sin(ang) * radius, isActive ? 14 : 9, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(`LatentMoE Tick r = ${tick}`, cx, cy - 15);
  ctx.fillStyle = '#10b981';
  ctx.font = '600 14px monospace';
  ctx.fillText(`||z^(r+1) - z^(r)|| = ${(0.25 * Math.pow(0.25, tick)).toFixed(5)}`, cx, cy + 18);
  ctx.fillStyle = '#c084fc';
  ctx.fillText('O(1) Memory Neumann VJP IFT', cx, cy + 45);

  // S3 Subcards
  const subcards = [
    { label: '1. Global Choice Head (Unbounded K Options)', spec: 'Heteroscedastic τ(z*) • 77+ Banking77 Labels • D_KL = 0', y: 195, c: '#00f2fe' },

    ctx.fillStyle = '#e2e8f0';
    ctx.font = '500 15px sans-serif';
    ctx.fillText(sc.spec, 605, sc.y + 75);
  });
}

// ============================================================================
// ANIMATION LOOP & EXPORT WRAPPER
// ============================================================================
function runLoop(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = (timestamp - startTime) / 1000.0;

  try {
    drawBackground(elapsed);

    if (elapsed < 6.0) {
      renderScene1(elapsed);
    } else if (elapsed < 13.0) {
      renderScene2(elapsed);
    } else if (elapsed < 20.0) {
      renderScene3(elapsed);
    } else if (elapsed <= DURATION) {
      renderScene4(elapsed);
    } else {
      isPlaying = false;
      statusText.textContent = 'Demo Complete. Click Play to view again.';
      return;
    }

    // Timeline loading bar
    ctx.fillStyle = '#00f2fe';
    ctx.fillRect(0, 715, (elapsed / DURATION) * 1280, 5);

    if (isPlaying) {
      statusText.textContent = `Rendering: ${elapsed.toFixed(1)}s / ${DURATION.toFixed(1)}s`;
      animFrame = requestAnimationFrame(runLoop);
    }
  } catch (err) {
    reportError('Critical loop execution failed', err);
  }
}

playBtn.addEventListener('click', () => {
  try {
    initAudio();
    cancelAnimationFrame(animFrame);
    triggeredCues.clear();
    startTime = null;
    isPlaying = true;
    animFrame = requestAnimationFrame(runLoop);
  } catch (e) { reportError('Failed to play animation', e); }
});

recordBtn.addEventListener('click', () => {
  try {
    initAudio();
    const stream = canvas.captureStream(60);
    
    // Polyfill: Test optimal video capture mime types based on runtime environment
    let selectedMime = 'video/webm';
    if (typeof MediaRecorder.isTypeSupported === 'function') {
      const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
      for (let t of types) {
        if (MediaRecorder.isTypeSupported(t)) {
          selectedMime = t;
          break;
        }
      }
    }
    
    const recorder = new MediaRecorder(stream, { mimeType: selectedMime });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    
    recorder.onstop = () => {
      try {
        const blob = new Blob(chunks, { type: selectedMime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ELMDE_Launch_Promo.webm';
        a.click();
        statusText.textContent = 'Success! webm file downloaded.';
      } catch (e) { reportError('Exporting video blob failed', e); }
    };

    triggeredCues.clear();
    startTime = null;
    isPlaying = true;
    recorder.start();
    statusText.textContent = '🔴 Capturing high-speed WebM output...';
    animFrame = requestAnimationFrame(runLoop);

    setTimeout(() => {
      if (recorder.state === 'recording') recorder.stop();
    }, DURATION * 1000 + 300);
  } catch (e) {
    reportError('Recording mechanism failed. Playback instead.', e);
  }
});

// Primary instant render trigger
try {
  drawBackground(0);
  renderScene4(22.0); // Show off the finale slide as default state on initial file open!
} catch (e) { reportError('Static pre-rendering failed', e); }
</script>
