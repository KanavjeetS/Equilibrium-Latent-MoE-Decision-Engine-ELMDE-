<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .flow-dash { stroke-dasharray: 6 4; animation: flowAnim 1.6s linear infinite; }
    .flow-dash-fast { stroke-dasharray: 6 4; animation: flowAnim 1.0s linear infinite; }
    .pulse-glow { animation: pulseAnim 3s infinite ease-in-out; }
    .spin-ring { animation: spinRing 16s linear infinite; transform-origin: 550px 335px; }

    @keyframes flowAnim {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 10px #38bdf8); }
    }
    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Background -->
  <rect width="1100" height="680" rx="16" fill="url(#bgDark)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section 1: Top Input Stage -->
  <g transform="translate(50, 40)">
    <!-- Input Card -->
    <rect width="320" height="64" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="26" class="mono" font-size="11" fill="#38bdf8" font-weight="700">STAGE 1: JAGGED INPUT / STATE</text>
    <text x="20" y="46" class="sans" font-size="13" fill="#e2e8f0">Context Prompt &amp; Document Text</text>
    <text x="240" y="46" class="mono" font-size="11" fill="#64748b">L ≤ 8192</text>

    <!-- Arrow to ModernBERT -->
    <line x1="320" y1="32" x2="410" y2="32" stroke="#38bdf8" stroke-width="2" class="flow-dash" />

    <!-- Backbone Card -->
    <g transform="translate(410, 0)">
      <rect width="340" height="64" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
      <text x="20" y="26" class="mono" font-size="11" fill="#38bdf8" font-weight="700">ModernBERT-large SVD GRAFT</text>
      <text x="20" y="46" class="sans" font-size="13" fill="#e2e8f0">De-Biased Bidirectional Encoder</text>
      <text x="260" y="46" class="mono" font-size="11" fill="#38bdf8">d = 1024</text>
    </g>

    <!-- Arrow to MLA -->
    <line x1="750" y1="32" x2="840" y2="32" stroke="#818cf8" stroke-width="2" class="flow-dash" />

    <!-- MLA Absorb Card -->
    <g transform="translate(840, 0)">
      <rect width="210" height="64" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
      <text x="16" y="26" class="mono" font-size="11" fill="#a5b4fc" font-weight="700">MLA ABSORB MODE</text>
      <text x="16" y="46" class="mono" font-size="11" fill="#38bdf8">W_UKQ = W_UQ W_UKᵀ</text>
    </g>
  </g>

  <!-- Connecting Bus to Latent Memory -->
  <path d="M 945 104 L 945 140 L 550 140 L 550 170" fill="none" stroke="#818cf8" stroke-width="2" class="flow-dash" />

  <!-- Section 2: Compressed KV Memory Cache -->
  <g transform="translate(250, 170)">
    <rect width="600" height="52" rx="10" fill="#0b1329" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="28" cy="26" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="46" y="22" class="mono" font-size="11" fill="#38bdf8" font-weight="700">COMPRESSED LATENT KV MEMORY CACHE (ℳ_KV)</text>
    <text x="46" y="40" class="sans" font-size="12" fill="#94a3b8">Low-Rank Latent Key-Value [c_KV (128-d) ; k_R (32-d)] — 98.5% Memory Cut vs Standard MHA</text>
    <rect x="510" y="14" width="75" height="24" rx="6" fill="#0369a1" />
    <text x="547" y="30" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">-98.5%</text>
  </g>

  <!-- Flow down to Core -->
  <line x1="550" y1="222" x2="550" y2="255" stroke="#38bdf8" stroke-width="2" class="flow-dash" />

  <!-- Section 3: Central Contractive Recurrent-Depth Latent-MoE Core -->
  <g transform="translate(180, 255)">
    <!-- Main Outer Container -->
    <rect width="740" height="190" rx="14" fill="url(#coreGrad)" stroke="#a855f7" stroke-width="2" />

    <!-- Header -->
    <text x="24" y="28" class="mono" font-size="12" fill="#c084fc" font-weight="700">STAGE 2: CONTRACTIVE RECURRENT-DEPTH LatentMoE CORE (BANACH FIXED-POINT)</text>
    <text x="24" y="48" class="sans" font-size="13" fill="#e2e8f0">z^(r+1) = (1 - α) z^(r) + α · LatentMoE(CrossAttn(z^(r), ℳ_KV))  |  Max Steps R ≤ 6</text>

    <!-- Internal Architecture Blocks -->
    <!-- Working Slots -->
    <g transform="translate(24, 65)">
      <rect width="130" height="95" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
      <text x="14" y="22" class="mono" font-size="10" fill="#94a3b8">WORKING SLOTS</text>
      <text x="14" y="42" class="mono" font-size="13" fill="#38bdf8" font-weight="700">M = 8 Slots</text>
      <text x="14" y="62" class="mono" font-size="11" fill="#cbd5e1">z ∈ ℝ^(8×1024)</text>
      <text x="14" y="80" class="mono" font-size="10" fill="#64748b">Decoupled RoPE</text>
    </g>

    <line x1="154" y1="112" x2="190" y2="112" stroke="#c084fc" stroke-width="2" class="flow-dash-fast" />

    <!-- Latent MoE Routing -->
    <g transform="translate(190, 65)">
      <rect width="210" height="95" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <text x="14" y="22" class="mono" font-size="10" fill="#c084fc">ROUTED LatentMoE</text>
      <text x="14" y="42" class="mono" font-size="12" fill="#e2e8f0">16 Routed Experts</text>
      <text x="14" y="60" class="mono" font-size="11" fill="#a855f7">Top-4 Activated / Tick</text>
      <text x="14" y="78" class="mono" font-size="10" fill="#94a3b8">Aux Loss L_aux = 0.010</text>
    </g>

    <line x1="400" y1="112" x2="435" y2="112" stroke="#c084fc" stroke-width="2" class="flow-dash-fast" />

    <!-- Damping & Convergence Module -->
    <g transform="translate(435, 65)">
      <rect width="165" height="95" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
      <text x="14" y="22" class="mono" font-size="10" fill="#4ade80">BANACH DAMPING</text>
      <text x="14" y="42" class="mono" font-size="13" fill="#22c55e" font-weight="700">ρ(J_Ψ) ≤ 0.6111</text>
      <text x="14" y="62" class="mono" font-size="11" fill="#cbd5e1">α = 0.450</text>
      <text x="14" y="80" class="mono" font-size="10" fill="#4ade80">Strict Contraction</text>
    </g>

    <line x1="600" y1="112" x2="635" y2="112" stroke="#22c55e" stroke-width="2" class="flow-dash-fast" />

    <!-- Fixed Point Equilibrium Output z* -->
    <g transform="translate(635, 65)">
      <rect width="80" height="95" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2" filter="url(#softGlow)" />
      <text x="40" y="32" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#4ade80">ATTRACTOR</text>
      <text x="40" y="58" text-anchor="middle" class="mono" font-size="20" font-weight="800" fill="#ffffff">z*</text>
      <text x="40" y="80" text-anchor="middle" class="mono" font-size="10" fill="#86efac">EQUILIBRIUM</text>
    </g>
  </g>

  <!-- Recurrent Loop Arrow Back -->
  <path d="M 725 320 C 760 320, 760 230, 550 230" fill="none" stroke="#c084fc" stroke-width="2" class="flow-dash-fast" stroke-opacity="0.8" />
  <text x="765" y="275" class="mono" font-size="10" fill="#c084fc">Loop r &lt; 6</text>

  <!-- Fan-out from z* to 3 Manifold Heads -->
  <path d="M 550 445 L 550 475 L 180 475 L 180 500" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-dash" />
  <path d="M 550 445 L 550 500" fill="none" stroke="#a855f7" stroke-width="2" class="flow-dash" />
  <path d="M 550 445 L 550 475 L 920 475 L 920 500" fill="none" stroke="#f59e0b" stroke-width="2" class="flow-dash" />

  <!-- Section 4: Tri-Modal Manifold Projection Heads -->
  <!-- Head 1: Choice Head -->
  <g transform="translate(60, 500)">
    <rect width="260" height="82" rx="10" fill="#0c1929" stroke="#0284c7" stroke-width="1.5" />
    <text x="16" y="24" class="mono" font-size="11" fill="#38bdf8" font-weight="700">1. GLOBAL CHOICE MANIFOLD</text>
    <text x="16" y="44" class="sans" font-size="12" fill="#e2e8f0">Heteroscedastic Temp τ(z*)</text>
    <text x="16" y="64" class="mono" font-size="11" fill="#22c55e">D_KL(P_true || P_model) ≡ 0.000</text>
  </g>

  <!-- Head 2: Ordinal CORN Head -->
  <g transform="translate(420, 500)">
    <rect width="260" height="82" rx="10" fill="#1e1338" stroke="#a855f7" stroke-width="1.5" />
    <text x="16" y="24" class="mono" font-size="11" fill="#c084fc" font-weight="700">2. CORN ORDINAL REGRESSION</text>
    <text x="16" y="44" class="sans" font-size="12" fill="#e2e8f0">Monotonic Cumulative Survival</text>
    <text x="16" y="64" class="mono" font-size="11" fill="#e879f9">P(Y &gt; k) ≥ P(Y &gt; k+1) Certified</text>
  </g>

  <!-- Head 3: Continuous Beta Density Head -->
  <g transform="translate(780, 500)">
    <rect width="260" height="82" rx="10" fill="#261b0c" stroke="#f59e0b" stroke-width="1.5" />
    <text x="16" y="24" class="mono" font-size="11" fill="#fbbf24" font-weight="700">3. CONTINUOUS BETA DENSITY</text>
    <text x="16" y="44" class="sans" font-size="12" fill="#e2e8f0">Posterior Mean &amp; Variance</text>
    <text x="16" y="64" class="mono" font-size="11" fill="#fcd34d">Beta(α, β) ∈ (0, 1)  |  Var &lt; 0.25</text>
  </g>

  <!-- Converge into Stage 5: Selective Conformal Risk Control -->
  <path d="M 190 582 L 190 605 L 420 605 L 420 615" fill="none" stroke="#0284c7" stroke-width="1.5" />
  <path d="M 550 582 L 550 615" fill="none" stroke="#a855f7" stroke-width="1.5" />
  <path d="M 910 582 L 910 605 L 680 605 L 680 615" fill="none" stroke="#f59e0b" stroke-width="1.5" />

  <!-- SCRC Gate Bar -->
  <g transform="translate(240, 615)">
    <rect width="620" height="48" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="24" cy="24" r="5" fill="#22c55e" />
    <text x="38" y="22" class="mono" font-size="11" fill="#38bdf8" font-weight="700">TWO-STAGE SELECTIVE CONFORMAL RISK CONTROL (SCRC) GATE</text>
    <text x="38" y="38" class="sans" font-size="11" fill="#94a3b8">Confidence ≥ τ* (0.9977) ➔ <tspan fill="#4ade80" font-weight="700">ACCEPTED (Certified Error ≤ 1%)</tspan>  |  Confidence &lt; τ* ➔ <tspan fill="#f87171" font-weight="700">ABSTAIN &amp; ESCALATE</tspan></text>
  </g>
</svg>