<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 19px; fill: #94a3b8; letter-spacing: 0.2px; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .node-pulse { animation: pulse 3s infinite ease-in-out; }
    .orbit-spin { animation: spin 20s linear infinite; transform-origin: 980px 210px; }
    .orbit-spin-reverse { animation: spinReverse 28s linear infinite; transform-origin: 980px 210px; }
    .dash-flow { stroke-dasharray: 8 6; animation: flow 2s linear infinite; }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes flow {
      from { stroke-dashoffset: 28; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Grid & Architectural Geometry -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="340" y1="0" x2="340" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="620" y1="0" x2="620" y2="420" />
    <line x1="760" y1="0" x2="760" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="380" x2="1200" y2="380" />
  </g>

  <!-- Glowing Axis Lines -->
  <line x1="80" y1="360" x2="1120" y2="360" stroke="url(#glowLine)" stroke-width="2" />

  <!-- Dynamic Equilibrium Orbital Graphic (Right Anchor) -->
  <g class="orbit-spin">
    <ellipse cx="980" cy="210" rx="150" ry="70" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="10 8" />
  </g>
  <g class="orbit-spin-reverse">
    <ellipse cx="980" cy="210" rx="140" ry="85" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="12 6" transform="rotate(45 980 210)" />
  </g>
  <g class="orbit-spin">
    <ellipse cx="980" cy="210" rx="130" ry="60" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(-30 980 210)" />
  </g>

  <!-- Fixed-Point Equilibrium Core Attractor z* -->
  <circle cx="980" cy="210" r="34" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
  <circle cx="980" cy="210" r="18" fill="#38bdf8" fill-opacity="0.25" />
  <circle cx="980" cy="210" r="8" fill="#ffffff" filter="url(#softGlow)" />
  <text x="980" y="270" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#38bdf8">z* EQUILIBRIUM</text>
  <text x="980" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">||z - Ψ(z)|| &lt; 10⁻³</text>

  <!-- Peripheral Satellite MoE Expert Nodes -->
  <g>
    <circle cx="890" cy="140" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="890" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#c7d2fe">E₁</text>
    <line x1="902" y1="148" x2="952" y2="190" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" class="dash-flow" />

    <circle cx="1070" cy="140" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="1070" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#c7d2fe">E₂</text>
    <line x1="1058" y1="148" x2="1008" y2="190" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" class="dash-flow" />

    <circle cx="1090" cy="270" r="14" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
    <text x="1090" y="274" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#e9d5ff">E₃</text>
    <line x1="1078" y1="262" x2="1008" y2="225" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" class="dash-flow" />

    <circle cx="870" cy="270" r="14" fill="#042f2e" stroke="#14b8a6" stroke-width="2" />
    <text x="870" y="274" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#99f6e4">E₄</text>
    <line x1="884" y1="262" x2="952" y2="225" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.5" class="dash-flow" />
  </g>

  <!-- Left Content: Title & Architecture Narrative -->
  <g transform="translate(80, 85)">
    <!-- Top Super-Badge -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8" />
    <text x="26" y="18" fill="#38bdf8" class="badge-text">NON-AUTOREGRESSIVE DECISION MODEL</text>

    <!-- Main Title -->
    <text x="0" y="72" class="title">
      <tspan fill="#ffffff">ELMDE</tspan> <tspan fill="url(#cyanPurple)">Decision Engine</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="108" class="subtitle">Equilibrium Latent-MoE with Exact Manifold Projection &amp; Conformal Risk</text>
    <text x="0" y="132" class="subtitle" font-size="15" fill="#64748b">Zero Autoregressive Distortion · Banach Fixed-Point Core · 98.5% KV Cache Cut</text>

    <!-- Key Performance Feature Badges -->
    <g transform="translate(0, 168)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <rect width="4" height="42" rx="2" fill="#22c55e" />
        <text x="16" y="18" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">KL DISTORTION</text>
        <text x="16" y="34" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#22c55e">D_KL ≡ 0.000</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(155, 0)">
        <rect width="145" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <rect width="4" height="42" rx="2" fill="#38bdf8" />
        <text x="16" y="18" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">SPECTRAL RADIUS</text>
        <text x="16" y="34" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#38bdf8">ρ(J_Ψ) ≤ 0.611</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(310, 0)">
        <rect width="145" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <rect width="4" height="42" rx="2" fill="#a855f7" />
        <text x="16" y="18" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">KV CACHE CUT</text>
        <text x="16" y="34" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#a855f7">98.5% SAVED</text>
      </g>

      <!-- Badge 4 -->
      <g transform="translate(465, 0)">
        <rect width="155" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <rect width="4" height="42" rx="2" fill="#f59e0b" />
        <text x="16" y="18" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">BANKING77 (77 INTENTS)</text>
        <text x="16" y="34" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#f59e0b">0.912 vs 0.425</text>
      </g>
    </g>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 230)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">
        FOUNDATION: <tspan fill="#e2e8f0">ModernBERT-large SVD</tspan> | 
        ATTENTION: <tspan fill="#e2e8f0">MLA Absorb</tspan> | 
        CORE: <tspan fill="#e2e8f0">Banach LatentMoE</tspan> | 
        GRADIENT: <tspan fill="#e2e8f0">O(1) Memory IFT</tspan> | 
        CERTIFICATION: <tspan fill="#e2e8f0">SCRC α ≤ 0.01</tspan>
      </text>
    </g>
  </g>
</svg>